[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-control-bridge"
version = "0.11.0"
description = "A standalone bridge for everyday iOS system services"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
iosctl = "ios_control_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
